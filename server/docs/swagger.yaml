        maxLength: 20
        minLength: 8
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  v1.UserLoginReq:
    properties:
      captchaCode:
        type: string
      captchaKey:
        type: string
      code:
        type: string
      password:
        type: string
      platform:
        type: string
      userName:
        type: string
    required:
    - password
    - userName
    type: object
  v1.UserRegisterReq:
    properties:
      code:
        type: string
      email:
        maxLength: 100
        type: string
      nickName:
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
      phone:
        type: string
      userName:
        maxLength: 20
        minLength: 4
        type: string
    required:
    - nickName
    - password
    - userName
    type: object
  v1.UserResetPasswordReq:
    properties:
      code:
        type: string
      newPassword:
        maxLength: 20
        minLength: 8
        type: string
      target:
        description: phone or email
        type: string
    required:
    - code
    - newPassword
    - target
    type: object
  v1.UserUpdateProfileReq:
    properties:
      avatar:
        type: string
      email:
        maxLength: 100
        type: string
      gender:
        enum:
        - "0"
        - "1"
        - "2"
        type: string
      nickName:
        type: string
      phone:
        type: string
    type: object
