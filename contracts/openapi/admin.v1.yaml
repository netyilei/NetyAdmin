components:
  schemas:
    cmd_netyadmin.dlqReplayRequest:
      properties:
        id:
          type: integer
      required:
      - id
      type: object
    cmd_netyadmin.smtpTestRequest:
      properties:
        to:
          type: string
      type: object
    cmd_netyadmin.smtpValues:
      properties:
        from:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
      type: object
    data:
      properties:
        data:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_transport.Page'
      type: object
    github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope:
      allOf:
      - $ref: '#/components/schemas/data'
      properties:
        code:
          description: 5 位字符串状态码
          type: string
        data:
          description: 业务数据
        details:
          additionalProperties: {}
          description: 错误结构化上下文
          type: object
        message_key:
          description: i18n 文案键（禁硬编码文案）
          type: string
        request_id:
          description: 请求链路
          type: string
        trace_id:
          description: 追踪链路
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_kernel_transport.Page:
      properties:
        list: {}
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      type: object
    github_com_netyilei_netyadmin_internal_modules_audit_domain.Record:
      properties:
        action:
          description: 动作（如 admin.users.update / login.failed）
          type: string
        actorId:
          description: Principal ID（system 记录为空）
          type: string
        actorType:
          description: admin | user | service | app | system | anonymous
          type: string
        bizCode:
          description: 5 位业务码（error/deny 时必带）
          type: string
        createdAt:
          description: 零值由 Sink 落库时补 now（UTC）
          type: string
        detail:
          additionalProperties: {}
          description: 结构化上下文（产生方已脱敏）
          type: object
        id:
          description: ULID（产生方生成；幂等/去重依据）
          type: string
        ip:
          type: string
        nodeId:
          type: string
        requestId:
          description: 必带（observability.md §1）
          type: string
        resource:
          description: 路由/资源（如 /admin/v1/users/:id）
          type: string
        result:
          description: success | deny | error
          type: string
        traceId:
          type: string
        type:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_audit_domain.RecordType'
          description: 类别
        userAgent:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_audit_domain.RecordType:
      enum:
      - 1
      - 2
      - 3
      - 4
      type: integer
      x-enum-comments:
        TypeAccess: API/WS 访问（transport 产生）
        TypeOperation: 管理端变更（application 写操作）
        TypeSecurity: 登录失败/越权/限流（security 触发）
        TypeSystem: 配置/模块变更（system 级）
      x-enum-varnames:
      - TypeOperation
      - TypeAccess
      - TypeSecurity
      - TypeSystem
    github_com_netyilei_netyadmin_internal_modules_gw_domain.QuotaConfig:
      properties:
        rate:
          description: 每秒请求数
          type: integer
      type: object
    github_com_netyilei_netyadmin_internal_modules_identity_application.LoginResult:
      properties:
        access_token:
          type: string
        expires_in:
          description: access 秒
          type: integer
        must_change_password:
          type: boolean
        profile:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_identity_domain.Profile'
        refresh_token:
          type: string
        token_type:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_identity_domain.Profile:
      properties:
        avatarUrl:
          type: string
        email:
          type: string
        id:
          type: string
        lastLoginAt:
          type: string
        mustChangePassword:
          type: boolean
        name:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_identity_domain.Status'
        username:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_identity_domain.Status:
      enum:
      - 1
      - 2
      type: integer
      x-enum-varnames:
      - StatusActive
      - StatusDisabled
    github_com_netyilei_netyadmin_internal_modules_rbac_domain.Api:
      properties:
        act:
          type: string
        createdAt:
          type: string
        id:
          type: string
        method:
          type: string
        path:
          type: string
        status:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_rbac_domain.Status'
        summary:
          type: string
        updatedAt:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_rbac_domain.Button:
      properties:
        code:
          type: string
        createdAt:
          type: string
        id:
          type: string
        menuId:
          type: string
        name:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_rbac_domain.Menu:
      properties:
        component:
          description: 前端视图路径（Geeker 动态路由消费）
          type: string
        createdAt:
          type: string
        hidden:
          type: boolean
        icon:
          description: Element Plus 图标名
          type: string
        id:
          type: string
        module:
          description: |-
            Module 是菜单所属模块（空=常显；非空时模块未启用则路由树不可见——
            与模块开关 message/storage/users.enabled 对齐，避免死菜单）。
          type: string
        name:
          type: string
        parentId:
          description: 空=根
          type: string
        path:
          type: string
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_rbac_domain.Status'
        updatedAt:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_rbac_domain.Role:
      properties:
        code:
          type: string
        createdAt:
          type: string
        id:
          type: string
        name:
          type: string
        remark:
          type: string
        status:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_rbac_domain.Status'
        updatedAt:
          type: string
      type: object
    github_com_netyilei_netyadmin_internal_modules_rbac_domain.Status:
      enum:
      - 1
      - 2
      type: integer
      x-enum-varnames:
      - StatusEnabled
      - StatusDisabled
    internal_modules_configcenter_adapters.rollbackRequest:
      properties:
        version:
          type: integer
      required:
      - version
      type: object
    internal_modules_configcenter_adapters.updateConfigsRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/internal_modules_configcenter_adapters.updateItem'
          type: array
          uniqueItems: false
        reason:
          maxLength: 255
          type: string
      required:
      - items
      type: object
    internal_modules_configcenter_adapters.updateItem:
      properties:
        description:
          maxLength: 255
          type: string
        group:
          maxLength: 100
          minLength: 1
          type: string
        isPublic:
          type: boolean
        key:
          maxLength: 100
          minLength: 1
          type: string
        value:
          maxLength: 4096
          type: string
        valueType:
          maximum: 4
          minimum: 1
          type: integer
      required:
      - group
      - key
      - valueType
      type: object
    internal_modules_gw_adapters.apiRequest:
      properties:
        description:
          maxLength: 255
          type: string
        grp:
          maxLength: 50
          type: string
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          type: string
        name:
          maxLength: 100
          type: string
        path:
          maxLength: 255
          type: string
        status:
          type: integer
      required:
      - method
      - name
      - path
      type: object
    internal_modules_gw_adapters.appStatusRequest:
      properties:
        status:
          type: integer
      required:
      - status
      type: object
    internal_modules_gw_adapters.createAppRequest:
      properties:
        appKey:
          maxLength: 64
          minLength: 16
          type: string
        ipGroupIds:
          description: IP 策略组集
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          maxLength: 100
          type: string
        quota:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_gw_domain.QuotaConfig'
        rateLimitEnabled:
          description: nil=默认开
          type: boolean
        remark:
          maxLength: 255
          type: string
        scopes:
          items:
            type: string
          type: array
          uniqueItems: false
        secret:
          maxLength: 128
          minLength: 16
          type: string
        storageRef:
          maxLength: 64
          type: string
      required:
      - appKey
      - name
      - secret
      type: object
    internal_modules_gw_adapters.ipGroupRequest:
      properties:
        name:
          maxLength: 100
          type: string
        remark:
          maxLength: 255
          type: string
      required:
      - name
      type: object
    internal_modules_gw_adapters.ipRuleRequest:
      properties:
        action:
          type: integer
        cidrs:
          type: string
        enabled:
          type: boolean
        groupId:
          type: string
        priority:
          type: integer
        remark:
          maxLength: 255
          type: string
      required:
      - action
      - cidrs
      - groupId
      type: object
    internal_modules_gw_adapters.scopeGroupRequest:
      properties:
        code:
          maxLength: 50
          minLength: 2
          type: string
        description:
          maxLength: 255
          type: string
        name:
          maxLength: 100
          type: string
        status:
          type: integer
      required:
      - code
      - name
      type: object
    internal_modules_gw_adapters.setScopeApisRequest:
      properties:
        apis:
          items:
            type: string
          type: array
          uniqueItems: false
        scope:
          maxLength: 50
          type: string
      required:
      - apis
      - scope
      type: object
    internal_modules_gw_adapters.updateAppRequest:
      properties:
        ipGroupIds:
          description: 非 nil=组集全量替换
          items:
            type: string
          type: array
          uniqueItems: false
        name:
          maxLength: 100
          type: string
        quota:
          $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_gw_domain.QuotaConfig'
        rateLimitEnabled:
          type: boolean
        remark:
          maxLength: 255
          type: string
        scopes:
          description: 非 nil=授权全量替换（表单单一保存入口）
          items:
            type: string
          type: array
          uniqueItems: false
        storageRef:
          maxLength: 64
          type: string
      type: object
    internal_modules_identity_adapters.batchDeleteRequest:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    internal_modules_identity_adapters.changePasswordRequest:
      properties:
        new_password:
          maxLength: 72
          minLength: 8
          type: string
        old_password:
          type: string
      required:
      - new_password
      - old_password
      type: object
    internal_modules_identity_adapters.createAdminRequest:
      properties:
        email:
          maxLength: 128
          type: string
        name:
          maxLength: 64
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
        username:
          maxLength: 32
          minLength: 3
          type: string
      required:
      - password
      - username
      type: object
    internal_modules_identity_adapters.loginRequest:
      properties:
        captchaCode:
          type: string
        captchaId:
          type: string
        password:
          type: string
        username:
          type: string
      required:
      - captchaCode
      - captchaId
      - password
      - username
      type: object
    internal_modules_identity_adapters.refreshRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    internal_modules_identity_adapters.resetPasswordResult:
      properties:
        password:
          description: 一次性交付（响应通道唯一，不落日志）
          type: string
      type: object
    internal_modules_identity_adapters.setStatusRequest:
      properties:
        status:
          type: integer
      required:
      - status
      type: object
    internal_modules_identity_adapters.updateAdminRequest:
      properties:
        email:
          description: nil=不改该列（列表已掩码——未取原文不回写）；空串=清除；格式见 handler 校验
          maxLength: 128
          type: string
        name:
          maxLength: 64
          type: string
        phone:
          description: nil=不改该列
          maxLength: 20
          type: string
      type: object
    internal_modules_identity_adapters.updateProfileRequest:
      properties:
        avatarUrl:
          description: data URL（≤200KB）或对象存储 URL
          maxLength: 300000
          type: string
        email:
          maxLength: 128
          type: string
        name:
          maxLength: 64
          type: string
        phone:
          maxLength: 20
          type: string
      type: object
    internal_modules_message_adapters.inboxSendRequest:
      properties:
        body:
          type: string
        title:
          type: string
        user_id:
          type: string
      required:
      - body
      - title
      - user_id
      type: object
    internal_modules_message_adapters.sendRequest:
      properties:
        target:
          type: string
        template_id:
          type: string
        vars:
          additionalProperties:
            type: string
          type: object
      required:
      - target
      - template_id
      type: object
    internal_modules_message_adapters.templateRequest:
      properties:
        body:
          type: string
        channel:
          type: string
        name:
          type: string
        status:
          enum:
          - 1
          - 2
          type: integer
        subject:
          type: string
      required:
      - body
      - channel
      - name
      - status
      type: object
    internal_modules_message_adapters.testEmailRequest:
      properties:
        to:
          type: string
      required:
      - to
      type: object
    internal_modules_rbac_adapters.apiRequest:
      properties:
        act:
          maxLength: 64
          type: string
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - '*'
          type: string
        path:
          maxLength: 128
          type: string
        status:
          type: integer
        summary:
          maxLength: 128
          type: string
      required:
      - act
      - method
      - path
      type: object
    internal_modules_rbac_adapters.buttonRequest:
      properties:
        code:
          maxLength: 64
          type: string
        menuId:
          maxLength: 32
          type: string
        name:
          maxLength: 64
          type: string
      required:
      - code
      - name
      type: object
    internal_modules_rbac_adapters.grantsResult:
      properties:
        apis:
          items:
            type: string
          type: array
          uniqueItems: false
        buttons:
          items:
            type: string
          type: array
          uniqueItems: false
        menus:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    internal_modules_rbac_adapters.idsRequest:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    internal_modules_rbac_adapters.menuRequest:
      properties:
        hidden:
          type: boolean
        name:
          maxLength: 64
          type: string
        parentId:
          maxLength: 32
          type: string
        path:
          maxLength: 128
          type: string
        sortOrder:
          minimum: 0
          type: integer
        status:
          type: integer
      required:
      - name
      type: object
    internal_modules_rbac_adapters.roleIDsResult:
      properties:
        roles:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    internal_modules_rbac_adapters.roleRequest:
      properties:
        code:
          maxLength: 64
          minLength: 2
          type: string
        name:
          maxLength: 64
          type: string
        remark:
          maxLength: 256
          type: string
        status:
          type: integer
      required:
      - code
      - name
      type: object
    internal_modules_storage_adapters.configRequest:
      properties:
        access_key:
          type: string
        allowed_types:
          type: string
        bucket:
          type: string
        bucket_lookup:
          description: 寻址风格：空/path（默认）/virtual-host（COS 等强制虚拟主机域名的 S3 兼容服务）
          type: string
        domain:
          type: string
        endpoint:
          type: string
        is_default:
          type: boolean
        max_file_size:
          type: integer
        name:
          type: string
        path_prefix:
          type: string
        provider:
          type: string
        region:
          type: string
        secret_key:
          type: string
        status:
          type: integer
      required:
      - access_key
      - bucket
      - endpoint
      - name
      - provider
      - secret_key
      type: object
    internal_modules_users_adapters.setStatusRequest:
      properties:
        status:
          type: integer
      required:
      - status
      type: object
  securitySchemes:
    BearerAuth:
      description: '管理端/客户端 Bearer token：`Authorization: Bearer <access_token>`（登录端点换取；refresh
        用 refresh_token）'
      in: header
      name: Authorization
      type: apiKey
info:
  description: 管理端 API 契约（adminapi 面；swag init --v3.1 生成入库 contracts/openapi）
  title: NetyAdmin Admin API
  version: 1.0.0
openapi: 3.1.0
security:
- BearerAuth: []
paths:
  /admin/v1/admins:
    get:
      operationId: admin.admins.list
      parameters:
      - description: 用户名前缀过滤
        in: query
        name: username
        schema:
          type: string
      - description: 姓名包含过滤
        in: query
        name: name
        schema:
          type: string
      - description: 状态过滤（1=active 2=disabled）
        in: query
        name: status
        schema:
          type: integer
      - description: 页码（1 起）
        in: query
        name: page
        schema:
          type: integer
      - description: 页大小（默认 20 上限 100）
        in: query
        name: page_size
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_transport.Page'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Forbidden
      summary: 管理员列表
      tags:
      - admins
    post:
      description: 初始密码一次性（must_change_password 强制首登改密）
      operationId: admin.admins.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_modules_identity_adapters.createAdminRequest'
              description: 账号与初始密码
              summary: body
        description: 账号与初始密码
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_identity_domain.Profile'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Conflict
      summary: 创建管理员
      tags:
      - admins
  /admin/v1/admins/{id}:
    delete:
      operationId: admin.admins.delete
      parameters:
      - description: 管理员 ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Not Found
      summary: 删除管理员
      tags:
      - admins
    get:
      operationId: admin.admins.get
      parameters:
      - description: 管理员 ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_modules_identity_domain.Profile'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Not Found
      summary: 管理员详情
      tags:
      - admins
    put:
      operationId: admin.admins.update
      parameters:
      - description: 管理员 ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_modules_identity_adapters.updateAdminRequest'
