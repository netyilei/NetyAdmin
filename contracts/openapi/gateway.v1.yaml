      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: 下游端点原始响应（信封形态随目标端点）
        "400":
          content:
            application/json:
              schema:
