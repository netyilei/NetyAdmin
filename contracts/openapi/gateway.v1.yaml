        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Service Unavailable
      summary: 网关业务 API 转发（GET）
      tags:
      - gateway
    patch:
      description: 签名 payload=body SHA256 hex；其余同 GET
      operationId: gateway.api.forward.patch
      parameters:
      - description: 内部路径
        in: path
        name: path
        required: true
        schema:
          type: string
      - description: AppKey（应用标识）
        in: header
        name: X-NA-App-Id
        required: true
        schema:
          type: string
      - description: Unix 秒级时间戳
        in: header
        name: X-NA-Timestamp
        required: true
