          type: string
      - description: 一次性随机串（防重放窗内唯一）
        in: header
        name: X-NA-Nonce
        required: true
        schema:
          type: string
      - description: HMAC-SHA256 签名（canonical 见 downstream-development §4）
        in: header
        name: X-NA-Signature
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: 下游端点原始响应（信封形态随目标端点）
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
