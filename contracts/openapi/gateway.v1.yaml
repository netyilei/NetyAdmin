  /gateway/v1/ws:
    get:
      description: ticket 一次性凭证换连接（edge HMAC 管线签发的 ticket；realtime 禁用时 503 fail-closed）
      operationId: gateway.ws.upgrade
      parameters:
      - description: POST /gateway/v1/ws/tickets 签发的一次性 ticket
        in: query
        name: ticket
        required: true
        schema:
          type: string
      responses:
        "101":
          description: Switching Protocols（WS 帧协议见 ws-protocol §3-§7）
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Forbidden
      summary: 网关 WebSocket 升级
      tags:
      - gateway
      security: []
  /gateway/v1/ws/tickets:
    post:
      description: App 身份（edge HMAC）换取一次性 ticket；channels 受 App ws.channel.* scope
        约束
      operationId: gateway.ws.ticket
      parameters:
      - description: AppKey（应用标识）
        in: header
        name: X-NA-App-Id
        required: true
        schema:
          type: string
      - description: Unix 秒级时间戳
        in: header
        name: X-NA-Timestamp
        required: true
        schema:
          type: string
      - description: 一次性随机串
        in: header
        name: X-NA-Nonce
        required: true
        schema:
          type: string
      - description: HMAC-SHA256 签名（canonical 见 downstream-development §4）
        in: header
        name: X-NA-Signature
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cmd_netyadmin.wsTicketDocRequest'
              description: 订阅意图（可省略）
              summary: body
        description: 订阅意图（可省略）
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_netyilei_netyadmin_internal_kernel_errorx.Envelope'
          description: Bad Request
